if(page==='Product Vault'){let p=state.products.find(x=>x.id===editProduct)||{};html=`<h1>Product vault</h1><p>Your actual products, evidence and reusable assets.</p><div class="split"><form id="quickAdd" class="card"><h2>Quick add from a link</h2><label>Amazon product link<input name="link" required placeholder="https://www.amazon.com/dp/… (your tagged link works too)"></label>${field('name','Product name (optional)','','text',false,'Leave blank to name it later')}<p class="muted">Saves the link right away. Details are marked “not verified” until Product Scout or you check them.</p><button class="primary">Add product</button></form><div class="card"><h2>Glam’s Picks</h2><p>${SEED_PRODUCTS.length} products and ${SEED_COLLECTIONS.length} collections from your boutique snapshot (Nov 3, 2026). Adds only what’s missing.</p><button onclick="loadPicks()">Load Glam’s Picks</button><details style="margin-top:14px"><summary class="muted">Your collections (${state.collections.length})</summary><ul class="list">${state.collections.map(c=>`<li><span>${esc(c.name)}</span><a href="${esc(c.url)}" target="_blank" rel="noopener">Open</a></li>`).join('')||'<li class="muted">None loaded yet.</li>'}</ul></details></div></div><form id="productForm" class="card fields"><h2 class="wide" style="margin:0">${p.id?'Edit product':'Add a product with full details'}</h2>${field('name','Product name',p.name,'text',true)}${field('category','Category',p.category)}${field('url','Canonical product URL',p.url,'url',true)}${field('affiliate','Your affiliate URL (optional)',p.affiliate,'url')}${area('facts','Product facts — only what the source supports',p.facts)}${field('source','Facts source URL',p.source,'url')}${field('date','Source checked on',p.date,'date')}${area('notes','Notes / brand details / reference instructions',p.notes)}<label class="wide">Product or creator reference images (PNG/JPG, up to 5 MB each)<input type="file" name="assets" accept="image/png,image/jpeg" multiple></label><div class="wide muted">Existing images stay when editing. New uploads are added. Images are included in backups and sent with Claude runs.</div><div class="row wide"><button class="primary">${p.id?'Save changes':'Save product'}</button>${p.id?'<button type="button" onclick="editProduct=\'\';render()">Cancel edit</button>':''}</div></form><div class="grid">${state.products.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.category||'Uncategorized')}</p>${p.facts.trim()?'':'<span class="flag">Details not verified</span>'}<div class="row">${p.assets.map(a=>`<img class="asset" src="${a.data}" alt="${esc(a.name)}">`).join('')}</div><p class="muted">${esc(p.facts||'No source facts added yet.')}</p><div class="row"><a href="${esc(p.url)}" target="_blank" rel="noopener">View product</a><button onclick="refreshProduct('${p.id}',this)">Fill from Amazon</button><button onclick="editProduct='${p.id}';render();window.scrollTo(0,0)">Edit</button><button class="danger" onclick="removeProduct('${p.id}')">Delete</button></div></div>`).join('')||'<div class="card empty wide">Your vault is empty. Load Glam’s Picks or paste a link above.</div>'}</div>`}
if(page==='Create Run'||page==='Solo Agents'){const r=state.runs.find(x=>x.id===editRun)||{},i=r.inputs||{};html=`<h1>${editRun?'Edit run':page==='Solo Agents'?'One agent. One focused task.':'Create a content run'}</h1><p>${page==='Solo Agents'?'Choose a specialist and save a complete handoff.':'Prepare all five specialists from one product brief.'}</p>${!state.products.length?'<div class="card"><h2>Add a product first</h2><p>Your content starts with real product details.</p><button class="primary" onclick="go(\'Product Vault\')">Add product</button></div>':`<form id="runForm" class="card fields"><label>Product<select name="product" required>${state.products.map(p=>`<option value="${p.id}" ${p.id===(i.product||prefProduct)?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>${editRun?'':select('scope','Create for',['This product only','Every product in my vault (one run each)'],'This product only')}${page==='Solo Agents'?select('role','Specialist',roles,i.role):'<input type="hidden" name="role" value="Full farm">'}${field('title','Run name',i.title,'text',true,'e.g. Holiday gift video')}${select('mode','Content type',['Product demonstration','Feature walkthrough','Evidence-based comparison','Roundup','Outfit styling','How-to','FAQ'],i.mode)}${select('presentation','Product presentation',['Not applicable','Holding the product','Wearing the product','Product only / no person'],i.presentation)}${field('objective','Goal',i.objective,'text',true)}${field('audience','Audience',i.audience||'Women 40+ learning to create and build businesses','text',true)}${select('platform','Destination',['Amazon storefront','TikTok','Instagram','YouTube','Facebook','Pinterest'],i.platform)}${select('duration','Video length',['15 seconds','30 seconds','60 seconds','90 seconds','Not a video'],i.duration)}${select('character','Creator / character',['No character','Use my uploaded creator references','Use existing character references'],i.character)}${field('tool','Preferred production tool',i.tool)}${area('references','Reference instructions / comparison product links',i.references)}${area('notes','Specific request, constraints and notes',i.notes)}<div class="wide muted">Saving creates a brief only. Nothing is generated, published or sent to Amazon. With “every product”, the product name is added to each run name.</div><button class="primary">${editRun?'Save changes':'Save run'}</button></form>`}`}
if(page==='Queue'||page==='Results'){const runs=[...state.runs].sort((a,b)=>b.updated-a.updated).filter(r=>page==='Queue'||r.result||r.resultUrl);const pending=state.runs.filter(r=>['saved','queued'].includes(r.status)).length;html=`<h1>${page==='Queue'?'Your run queue':'Your results'}</h1><p>${page==='Queue'?'Saved briefs, Claude drafts waiting for review, and approved work.':'Output attached to a run: Claude drafts and anything you pasted or linked.'}</p>${page==='Queue'&&runs.length?`<div class="card row" style="justify-content:space-between"><span>${pending} run${pending===1?'':'s'} ready to draft</span><button class="primary" ${!sampleReady||!pending||busy?'disabled':''} onclick="runAll(this)">${busy?'Running…':'Run all saved with Claude'}</button></div>`:''}${runs.map(r=>`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(r.inputs.title)}</h3><span class="pill ${pillClass(r.status)}">${esc(r.status)}</span></div><p>${esc(r.product.name)} · ${esc(r.inputs.role)} · ${esc(r.inputs.platform)}</p><div class="row"><button class="primary" onclick="showRun('${r.id}')">${r.status==='needs review'?'Review draft':'View / run'}</button><button onclick="editRun='${r.id}';go('${r.inputs.role==='Full farm'?'Create Run':'Solo Agents'}')">Edit</button><button class="danger" onclick="removeRun('${r.id}')">Delete</button></div></div>`).join('')||'<div class="card empty"><h2>Nothing here yet</h2><p>Save a run, then press Run with Claude. Drafts come back here for your review.</p><button onclick="go(\'Create Run\')">Create a run</button></div>'}`}
if(page==='Help')html=`<h1>Help & connections</h1><div class="split"><div class="card"><h2>Your simple workflow</h2><ol><li>Load Glam’s Picks or paste a product link.</li><li>Create a full run or pick one agent. Use “every product” to batch.</li><li>In the queue, press <strong>Run with Claude</strong> or <strong>Run all saved</strong>.</li><li>Read each draft (status: needs review). Edit it, check facts on the live Amazon page, then set status to done.</li><li>Post it yourself. This farm never posts or sends anything.</li></ol><p class="muted">The first Claude run asks your permission. Runs use your Claude plan’s usage. If Run with Claude isn’t available, use Copy Task and paste into chat.</p></div><div class="card"><h2>Amazon storefront</h2>${amazonLinks()}<p><strong>Product data:</strong> ${esc(amazonMsg)}</p>${amazonBtn()}${IN_CLAUDE?`<details><summary><strong>Connector setup (one time)</strong></summary><ol class="muted"><li>In Claude, open <strong>Settings → Connectors</strong>.</li><li>Click <strong>Add custom connector</strong>.</li><li>Name: <strong>Glam Amazon Connector</strong> (exactly).</li><li>URL: the private connector address Claude gave you in chat.</li><li>Click <strong>Add</strong>, come back here, and press Test Amazon connection. Allow the page when it asks.</li></ol></details>`:''}<p class="muted">Your Creators API keys live on your private server (glam-amazon-connect on Netlify), never in this page. Amazon only answers product lookups for accounts with 10 qualifying sales in the last 30 days; until then the test says “not eligible” and everything else here still works. Amazon has no API for posting to storefronts or reading earnings, so idea lists and videos are added by you on Amazon.</p><form id="storeForm">${field('storefront','Your storefront URL',state.storefront,'url')}<p><button>Save link</button></p></form><p class="muted">Saving a link is a bookmark, not account access. This is a creator storefront workspace, not Seller Central.</p></div></div><div class="card"><h2>Back up your workspace</h2><p>Records and uploaded images stay in this browser. Export a backup before switching devices or clearing browser data. No API keys belong in this workspace.</p><button onclick="backup()">Export JSON backup</button><hr><label>Restore a backup<input type="file" id="importFile" accept="application/json,.json"></label><p>${select('restoreMode','Restore mode',['Merge (keep existing IDs)','Replace all data'])}</p><button onclick="restore()">Import backup</button></div>`;
$('#app').innerHTML=html;$('#app').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{shopCat=b.dataset.cat;render()});$('#quickAdd')?.addEventListener('submit',quickAdd);$('#productForm')?.addEventListener('submit',saveProduct);$('#runForm')?.addEventListener('submit',saveRun);$('#storeForm')?.addEventListener('submit',async e=>{e.preventDefault();const v=new FormData(e.target).get('storefront');if(!url(v))return toast('Use an http or https link.');if(await change(s=>s.storefront=v)){render();toast('Storefront link saved. Automatic sync is not connected.')}});}

async function quickAdd(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const link=d.link.trim();let u;try{u=new URL(link)}catch{return toast('Paste a full Amazon link starting with https://')}if(!/(^|\.)amazon\.com$/.test(u.hostname))return toast('Use an amazon.com product link. Short amzn.to links: open them first and copy the full address.');const asin=asinOf(link);if(!asin)return toast('That link has no product code (/dp/…). Open the product page and copy its address.');const canon='https://www.amazon.com/dp/'+asin;if(state.products.some(p=>p.url===canon||asinOf(p.url)===asin))return toast('This product is already in your vault.');const seed=SEED_PRODUCTS.find(x=>x[1]===asin);const tagged=u.searchParams.get('tag')?canon+'?tag='+encodeURIComponent(u.searchParams.get('tag')):'';const p={id:uid(),name:d.name.trim()||(seed?seed[0]:'Amazon product '+asin),category:'',url:canon,affiliate:tagged,facts:'',source:canon,date:'',notes:'Added from a pasted link. Price, availability and features are NOT verified yet.',assets:[]};if(await change(s=>s.products.push(p))){render();toast('Product added. Checking Amazon for details…');refreshProduct(p.id).catch(()=>{})}}
async function readAssets(files){return Promise.all([...files].map(f=>new Promise((ok,no)=>{if(!['image/png','image/jpeg'].includes(f.type)||f.size>5*1024*1024)return no(Error('Use PNG/JPG images under 5 MB.'));const rd=new FileReader();rd.onload=()=>ok({name:f.name,data:rd.result});rd.onerror=()=>no(Error('Image could not be read.'));rd.readAsDataURL(f)})))}
async function saveProduct(e){e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));delete d.assets;if(![d.url,d.affiliate,d.source].every(url))return toast('Use valid http or https links.');try{const old=state.products.find(p=>p.id===editProduct);const assets=[...(old?.assets||[]),...await readAssets(f.elements.assets.files)];const p={...d,id:old?.id||uid(),assets};if(await change(s=>{s.products=s.products.filter(x=>x.id!==p.id);s.products.push(p)})){editProduct='';render();toast('Product saved.')}}catch(e){toast(e.message)}}
async function saveRun(e){e.preventDefault();const inputs=Object.fromEntries(new FormData(e.target));const all=inputs.scope&&inputs.scope.startsWith('Every');delete inputs.scope;const list=all&&!editRun?state.products:[state.products.find(p=>p.id===inputs.product)].filter(Boolean);if(!list.length)return toast('Choose a saved product.');if(inputs.character!=='No character'&&list.some(p=>!p.assets.length))return toast('Add creator reference images to '+(all?'every product':'this product')+' first, or choose No character.');const old=state.runs.find(r=>r.id===editRun);const made=[];for(const prod of list){const inp={...inputs,product:prod.id,title:all?inputs.title+' — '+prod.name:inputs.title};if(!editRun&&state.runs.some(r=>JSON.stringify(r.inputs)===JSON.stringify(inp)))continue;made.push({id:old?.id||uid(),inputs:inp,product:structuredClone(prod),status:old?.status||'saved',result:old?.result||'',resultUrl:old?.resultUrl||'',updated:Date.now()+made.length})}if(!made.length)return toast('This exact run already exists in your queue.');e.submitter.disabled=true;if(await change(s=>{const ids=made.map(m=>m.id);s.runs=s.runs.filter(r=>!ids.includes(r.id));s.runs.push(...made)})){editRun='';go('Queue');toast(made.length>1?`${made.length} runs saved. Press Run all saved to draft them.`:'Run saved. Press View / run, then Run with Claude.')}else e.submitter.disabled=false}
function task(r){let selected=r.inputs.role==='Full farm'?roles:[r.inputs.role];return `Act as my Amazon creator storefront content team. Complete the following request using real supplied evidence.\nStorefront: ${state.storefront || 'Not set'}\nAccount reports (requires authorized access): ${reportUrl}\nDo not claim access to these pages unless you actually retrieve them.\n\nRUN INPUTS\n${Object.entries(r.inputs).filter(([k])=>k!=='product').map(([k,v])=>k+': '+v).join('\n')}\n\nPRODUCT SNAPSHOT\n${Object.entries(r.product).filter(([k])=>!['id','assets'].includes(k)).map(([k,v])=>k+': '+v).join('\n')}\nReference image files: ${r.product.assets.map(a=>a.name).join(', ')||'None'}. Images must be attached separately; filenames do not give you image access.\n\nASSIGNMENTS\n${selected.map(role=>role+': '+tasks[roles.indexOf(role)]).join('\n\n')}\n\nCONSTRAINTS\nDo not invent personal use, testimonials, facts, prices, discounts, sales, commissions or affiliate URLs. Distinguish source-backed facts from unverified statements; research current details when supported. Preserve reference identity and body proportions. Use only the selected production tool; flag unavailable access. No publishing or purchases are authorized. Include transparent affiliate disclosure where relevant; verify current requirements before claiming compliance.\n\nDELIVERABLES\nProvide the requested specialist output in complete copyable sections. For a full run: evidence review, three content angles, shot list, timed script, visual prompts, caption/disclosure draft and production checklist. Identify missing inputs and unsupported claims. Provide actual media links only when generated.\n\nEXECUTION STATE\nDashboard manual status: ${r.status}. This is a saved handoff, not proof of execution.`}
const CLAUDE_NOTE=`\n\nRUN CONTEXT\nYou are running inside Glam's dashboard with no web access and no memory. You cannot open the links above. Do not state price, availability, ratings or specs unless they appear in PRODUCT SNAPSHOT facts. For anything else, write "[verify on Amazon]" and list it under "Facts Glam must check before posting". Use the attached images only if provided. Write in plain, warm, beginner-friendly language. Use clear section headings. This is a draft for Glam's review.`;
async function getSampler(){if(sampler!==undefined)return sampler;try{sampler=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch{sampler=null}sampleReady=!!sampler;render();return sampler}
async function runOne(id,onText){const s=await getSampler();if(!s)throw Object.assign(Error('Run with Claude is not available here. Use Copy Task.'),{code:'not_granted'});const r=state.runs.find(x=>x.id===id);if(!r)throw Error('Run not found.');await change(st=>Object.assign(st.runs.find(x=>x.id===id),{status:'working',updated:Date.now()}));let images=[];try{const lim=await s.limits?.();if(lim&&lim.images&&r.product.assets.length)images=await Promise.all(r.product.assets.slice(0,4).map(a=>fetch(a.data).then(x=>x.blob())))}catch{images=[]}try{const out=await s(task(r)+CLAUDE_NOTE,{modelTier:'default',images:images.length?images:undefined,onText:onText?({text})=>onText(text):undefined});const text=(out&&out.text)||'';if(!text.trim())throw Error('Claude returned an empty draft.');await change(st=>Object.assign(st.runs.find(x=>x.id===id),{status:'needs review',result:text+(out.truncated?'\n\n[Draft was cut off. Run again or ask for the rest in chat.]':''),updated:Date.now()}));return true}catch(e){await change(st=>{const x=st.runs.find(x=>x.id===id);if(x){x.status='failed';if(e.text&&!x.result)x.result='[Partial draft before error]\n'+e.text;x.updated=Date.now()}});throw e}}
async function runFromDetail(id,btn){btn.disabled=true;btn.textContent='Claude is drafting…';const out=$('#liveOut');out.classList.remove('hidden');out.textContent='Thinking…';try{await runOne(id,t=>{out.textContent=t});toast('Draft ready for your review.');showRun(id);render()}catch(e){out.textContent='';toast(e.code==='rate_limited'?'Claude is busy. Wait a minute and try again.':e.code==='not_granted'?'Permission was not given. Use Copy Task instead.':(e.message||'Run failed.'));showRun(id);render()}}
async function runAll(btn){const ids=state.runs.filter(r=>['saved','queued'].includes(r.status)).sort((a,b)=>a.updated-b.updated).map(r=>r.id);if(!ids.length)return;if(!await __ask(`Draft ${ids.length} run${ids.length>1?'s':''} with Claude, one at a time? This uses your Claude plan’s usage. Nothing is posted.`))return;busy=true;render();let done=0;for(const id of ids){toast(`Drafting ${done+1} of ${ids.length}…`);try{await runOne(id);done++;render()}catch(e){toast(e.code==='rate_limited'?`Paused after ${done}: Claude is busy. Try again in a minute.`:e.code==='not_granted'?'Permission was not given. Stopped.':`Stopped after ${done}: ${e.message||'run failed'}`);break}}busy=false;render();if(done===ids.length)toast(`All ${done} drafts are ready for your review.`)}
function showRun(id){const r=state.runs.find(r=>r.id===id);lastTask=task(r);$('#detailBody').innerHTML=`<p>${esc(r.inputs.title)} · ${esc(r.product.name)} <span class="pill ${pillClass(r.status)}">${esc(r.status)}</span></p><div class="row"><button class="primary" id="runBtn" ${sampleReady?'':'disabled title="Not available in this view"'}>${r.result?'Run again with Claude':'Run with Claude'}</button><button onclick="copyTask()">Copy Task</button></div><p class="muted">${sampleReady?'Claude drafts it here and the status becomes “needs review”. Nothing is posted.':'Run with Claude isn’t available in this view. Copy the task and paste it into Claude, with the reference images.'}</p><pre id="liveOut" class="hidden" aria-live="polite"></pre><div class="row">${r.product.assets.map(a=>`<a href="#" onclick="fetch('${a.data}').then(r=>r.blob()).then(b=>__saveOut('${esc(a.name)}',b));return false"><img class="asset" src="${a.data}" alt="${esc(a.name)}"></a>`).join('')}</div><details><summary class="muted">Show the full task</summary><pre>${esc(lastTask)}</pre></details><form id="resultForm">${select('status','Status',STATUSES,r.status)}<p class="muted">Needs review = Claude drafted it. Done = you read it, checked facts and approved it.</p>${area('result','Draft / completed output (you can edit it)',r.result)}${field('resultUrl','Result or playable video URL',r.resultUrl,'url')}<p class="row"><button class="primary">Save</button>${r.status==='needs review'?'<button type="button" id="approveBtn">Approve (mark done)</button>':''}</p></form>`;$('#runBtn').onclick=e=>runFromDetail(id,e.currentTarget);const save=async(e,forceDone)=>{e.preventDefault();const d=Object.fromEntries(new FormData($('#resultForm')));if(forceDone)d.status='done';if(!url(d.resultUrl))return toast('Use an http or https result link.');if(d.status==='done'&&!d.result.trim()&&!d.resultUrl)return toast('Attach the completed output before marking done.');if(await change(s=>Object.assign(s.runs.find(x=>x.id===id),d,{updated:Date.now()}))){detail.close();render();toast(forceDone?'Approved. Post it yourself when ready.':'Run updated.')}};$('#resultForm').onsubmit=e=>save(e,false);$('#approveBtn')?.addEventListener('click',e=>save(e,true));if(!detail.open)detail.showModal()}
async function copyTask(){try{await navigator.clipboard.writeText(lastTask);toast('Task copied. Paste it into Claude.')}catch{const t=document.createElement('textarea');t.value=lastTask;detail.append(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}if(ok){t.remove();toast('Task copied.')}else toast('Select the text box and press Ctrl+C / Copy.')}}
async function removeRun(id){if(await __ask('Delete this run and its attached results?')&&await change(s=>s.runs=s.runs.filter(r=>r.id!==id))){render();toast('Run deleted.')}}
async function removeProduct(id){if(await __ask('Delete this product? Existing runs keep their product snapshots.')&&await change(s=>s.products=s.products.filter(p=>p.id!==id))){render();toast('Product deleted.')}}
function backup(){__saveOut('glam-amazon-farm-backup.json',JSON.stringify(state))}
function valid(s){const str=x=>typeof x==='string';const prod=p=>p&&str(p.id)&&/^[\w-]+$/.test(p.id)&&['name','url','affiliate','category','facts','source','date','notes'].every(k=>str(p[k]))&&[p.url,p.affiliate,p.source].every(url)&&Array.isArray(p.assets)&&p.assets.every(a=>str(a.name)&&str(a.data)&&/^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(a.data));const col=c=>c&&str(c.name)&&str(c.url)&&url(c.url);return s&&(s.version===1||s.version===2)&&str(s.storefront)&&url(s.storefront)&&(s.version===1||(Array.isArray(s.collections)&&s.collections.every(col)))&&Array.isArray(s.products)&&s.products.every(prod)&&Array.isArray(s.runs)&&s.runs.every(r=>r&&str(r.id)&&/^[\w-]+$/.test(r.id)&&prod(r.product)&&r.inputs&&['product','role','title','mode','presentation','objective','audience','platform','duration','character','tool','references','notes'].every(k=>str(r.inputs[k]))&&['Full farm',...roles].includes(r.inputs.role)&&STATUSES.includes(r.status)&&str(r.result)&&str(r.resultUrl)&&url(r.resultUrl)&&Number.isFinite(r.updated)&&(r.status!=='done'||r.result.trim()||r.resultUrl))&&new Set(s.products.map(p=>p.id)).size===s.products.length&&new Set(s.runs.map(p=>p.id)).size===s.runs.length}
function upgrade(s){if(s.version===1)return {...s,version:2,collections:[],seeded:false};return {...s,seeded:!!s.seeded}}
async function restore(){try{const f=$('#importFile').files[0];if(!f)return toast('Choose a JSON backup first.');if(f.size>100*1024*1024)throw Error('Backup is too large.');const raw=JSON.parse(await f.text());if(!valid(raw))throw Error('Invalid backup. No data changed.');const incoming=upgrade(raw);const replace=$('[name=restoreMode]').value.startsWith('Replace');if(replace&&!await __ask('Replace all current products and runs with this backup?'))return;const n=replace?incoming:{...state,products:[...state.products,...incoming.products.filter(p=>!state.products.some(a=>a.id===p.id))],runs:[...state.runs,...incoming.runs.filter(p=>!state.runs.some(a=>a.id===p.id))],collections:[...state.collections,...incoming.collections.filter(c=>!state.collections.some(a=>a.url===c.url))]};if(await persist(n)){render();toast('Backup restored.')}}catch(e){toast(e.message)}}

const request=indexedDB.open('glam-amazon-farm',1);request.onupgradeneeded=()=>request.result.createObjectStore('data');request.onerror=()=>{$('#app').innerHTML='<div class="card"><h1>Browser storage is unavailable</h1><p>Open in a regular browser window with site storage enabled.</p></div>'};request.onsuccess=()=>{db=request.result;const q=db.transaction('data').objectStore('data').get('state');q.onsuccess=async()=>{let loaded=true;if(q.result){if(!valid(q.result)){loaded=false;toast('Stored data could not be loaded. Restore a valid backup.')}else state=upgrade(q.result)}if(loaded&&!state.seeded){const next=structuredClone(state);const added=seedProducts(next);if(await persist(next)&&added)toast(`Loaded ${added} Glam’s Picks products and ${SEED_COLLECTIONS.length} collections.`)}render();getSampler()};q.onerror=()=>toast('Unable to load saved work.')};
</script></html>
