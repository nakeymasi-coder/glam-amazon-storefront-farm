;gap:16px}label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600}input,select,textarea{width:100%;padding:12px;border:1px solid #bcccd8;border-radius:8px;background:white;color:#142c3e}textarea{min-height:100px;resize:vertical}.wide{grid-column:1/-1}.muted{font-size:13px;color:#607788}.empty{text-align:center;padding:34px}.asset{width:80px;height:80px;object-fit:cover;border-radius:8px}.danger{color:#aa2636}.hidden{display:none!important}dialog{width:min(800px,94vw);max-height:90vh;border:1px solid #c6d5e1;border-radius:16px;padding:25px}dialog::backdrop{background:#142c3e88}pre{white-space:pre-wrap;word-break:break-word;background:#f1f6f9;padding:18px;border-radius:8px;font:13px/1.6 monospace}#notice{position:fixed;bottom:20px;right:20px;background:#103b63;color:white;border-radius:10px;padding:14px 20px;max-width:90vw;z-index:5}a{color:#0874bf}hr{border:0;border-top:1px solid #e0e8ee;margin:24px 0}@media(max-width:800px){aside{position:static;width:auto;padding:18px}.brand{font-size:22px}.subtitle{margin:4px 0 14px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}aside footer{display:none}main{margin:0;padding:20px}.grid,.split,.fields{grid-template-columns:1fr}.hero{padding:24px}h1{font-size:28px}.top{margin-bottom:20px}.wide{grid-column:auto}}

window.__ask=function(msg,withInput,def){return new Promise(function(res){var d=document.getElementById('__askBox'),t=document.getElementById('__askText'),inp=document.getElementById('__askInput'),y=document.getElementById('__askYes'),n=document.getElementById('__askNo');t.textContent=msg;inp.style.display=withInput?'block':'none';inp.value=def||'';var done=function(v){y.onclick=n.onclick=null;d.onclose=null;if(d.open)d.close();res(v)};y.onclick=function(){done(withInput?inp.value:true)};n.onclick=function(){done(withInput?null:false)};d.onclose=function(){done(withInput?null:false)};try{d.showModal()}catch(e){d.setAttribute('open','')}if(withInput)setTimeout(function(){inp.focus()},50)})};
window.__askPrompt=function(msg,def){return window.__ask(msg,true,def)};
function __plainDl(n,d){var b=d instanceof Blob?d:new Blob([d]);var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);return true};var __dl;window.__saveOut=async function(name,data){try{if(__dl===undefined)__dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){__dl=null}if(!__dl){return __plainDl(name,data)}try{await __dl.save({filename:name,data:data});return true}catch(e){if(e&&e.code!=='declined')alertBox('Could not save the file here.');return false}};
function alertBox(m){var d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#103b63;color:#fff;padding:12px 18px;border-radius:10px;z-index:99999;font:14px Montserrat,Arial,sans-serif';document.body.appendChild(d);setTimeout(function(){d.remove()},4000)}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roles=['Product Scout','Product Review Strategist','Character & Visual Director','Script & Video Producer','Caption & Disclosure Editor'];
const tasks=['Check the supplied product links and source facts. Separate verified details from unknowns. Suggest research questions and useful product categories without inventing affiliate links.','Create three specific content angles, audience use cases, buyer questions, and an evidence-based demonstration plan.','Create a shot list and complete visual prompts grounded in supplied references. Preserve identity, age, skin tone and body proportions. Do not invent reference assets.','Write a timed hook, scene-by-scene script, spoken lines, B-roll and a production handoff for the selected tool. Do not claim a video was generated unless a playable output exists.','Write three caption options, a clear CTA, and a transparent affiliate disclosure draft. Flag any current platform requirements that still need verification.'];
const tabs=['Home','Product Vault','Create Run','Solo Agents','Queue','Results','Help'];let connectionMessage='Credentials saved securely. Test Amazon access to check eligibility.';let db,state={version:1,products:[],runs:[],storefront:'https://www.amazon.com/shop/glamorousgrammyglowup?ccs_id=21f72b6e-9bed-423c-be20-5f9b356d5780'},page='Home',editProduct='',editRun='',lastTask='';
function toast(t){$('#notice').textContent=t;$('#notice').classList.remove('hidden');clearTimeout(window.nt);window.nt=setTimeout(()=>$('#notice').classList.add('hidden'),4500)}
function url(v){if(!v)return true;try{return ['https:','http:'].includes(new URL(v).protocol)}catch{return false}}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
async function persist(next){try{await new Promise((ok,no)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(next,'state');tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});state=next;return true}catch(e){toast('Could not save. Storage may be full. Export a backup and free space.');return false}}
async function change(fn){const next=structuredClone(state);fn(next);return persist(next)}
const field=(name,title,value='',type='text',required=false)=>`<label>${title}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;
const area=(name,title,value='')=>`<label class="wide">${title}<textarea name="${name}">${esc(value)}</textarea></label>`;
const select=(name,title,values,value)=>`<label>${title}<select name="${name}">${values.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;
const reportUrl='https://affiliate-program.amazon.com/p/reporting/earnings?ref=exp_inf_rep_glamorousgrammyglowup';
function amazonLinks(){return `<div class="row">${state.storefront?`<a href="${esc(state.storefront)}" target="_blank" rel="noopener">Open my storefront</a>`:''}<a href="${reportUrl}" target="_blank" rel="noopener">Open Amazon reports</a></div>`}
function go(p){page=p;render()}
function render(){ $('#nav').innerHTML=tabs.map(p=>`<button class="${p===page?'active':''}" data-page="${p}">${p}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page));let html='';
if(page==='Home')html=`<div class="hero"><div class="eyebrow">FROM PRODUCT TO CONTENT</div><h1>Your storefront. Your creative team.</h1><p>Turn your real Amazon finds into organized briefs, scripts and content.<br>One workspace, five focused agent workflows.</p><button class="primary" onclick="go('Create Run')">Create a content run</button> <button onclick="go('Product Vault')">Add a product</button></div><div class="grid">${[['Products in vault',state.products.length],['Saved runs',state.runs.length],['Results attached',state.runs.filter(r=>r.result||r.resultUrl).length]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="count">${b}</div></div>`).join('')}</div><div class="split"><div class="card"><h2>Your next step</h2><p>${state.products.length?'Choose a product and build its content brief.':'Add your first product with its Amazon link, source facts and photos.'}</p><button onclick="go('${state.products.length?'Create Run':'Product Vault'}')">${state.products.length?'Create run':'Open product vault'}</button></div><div class="card"><h2>Your Amazon workspace</h2>${amazonLinks()}<p>${esc(connectionMessage)}</p><button onclick="checkAmazon(this)">Test Amazon access</button><p>Amazon analytics sync: not connected<br>Automatic agent execution: not connected</p><div class="muted">Copy a prepared task into chat to execute it. Saved runs are briefs, not background jobs.</div></div></div>`;
if(page==='Product Vault'){let p=state.products.find(x=>x.id===editProduct)||{};html=`<h1>Product vault</h1><p>Your actual products, evidence and reusable assets.</p><form id="amazonImport" class="card"><h2>Look up an Amazon product</h2><label>ASIN or Amazon product link<input name="asin" required placeholder="10-character ASIN or full Amazon product link"></label><p class="muted">Uses your Amazon API access. Products are added only after Amazon returns their details. This does not import your entire storefront or sales reports.</p><button class="primary">Look up and add product</button></form><form id="productForm" class="card fields">${field('name','Product name',p.name,'text',true)}${field('category','Category',p.category)}${field('url','Canonical product URL',p.url,'url',true)}${field('affiliate','Your affiliate URL (optional)',p.affiliate,'url')}${area('facts','Product facts — only what the source supports',p.facts)}${field('source','Facts source URL',p.source,'url')}${field('date','Source checked on',p.date,'date')}${area('notes','Notes / brand details / reference instructions',p.notes)}<label class="wide">Product or creator reference images (PNG/JPG, up to 5 MB each)<input type="file" name="assets" accept="image/png,image/jpeg" multiple></label><div class="wide muted">Existing images stay when editing. New uploads are added. Images are included in backups.</div><div class="row wide"><button class="primary">${p.id?'Save changes':'Save product'}</button>${p.id?'<button type="button" onclick="editProduct=\'\';render()">Cancel edit</button>':''}</div></form><div class="grid">${state.products.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p>${esc(p.category||'Uncategorized')}</p><div class="row">${p.assets.map(a=>`<img class="asset" src="${a.data}" alt="${esc(a.name)}">`).join('')}</div><p class="muted">${esc(p.facts||'No source facts added yet.')}</p><div class="row"><a href="${esc(p.url)}" target="_blank" rel="noopener">View product</a><button onclick="editProduct='${p.id}';render();window.scrollTo(0,0)">Edit</button><button class="danger" onclick="removeProduct('${p.id}')">Delete</button></div></div>`).join('')||'<div class="card empty wide">Your vault is empty. Add your first real product above.</div>'}</div>`}
if(page==='Create Run'||page==='Solo Agents'){const r=state.runs.find(x=>x.id===editRun)||{},i=r.inputs||{};html=`<h1>${editRun?'Edit run':page==='Solo Agents'?'One agent. One focused task.':'Create a content run'}</h1><p>${page==='Solo Agents'?'Choose a specialist and save a complete handoff.':'Prepare all five specialists from one product brief.'}</p>${!state.products.length?'<div class="card"><h2>Add a product first</h2><p>Your content starts with real product details.</p><button class="primary" onclick="go(\'Product Vault\')">Add product</button></div>':`<form id="runForm" class="card fields"><label>Product<select name="product" required>${state.products.map(p=>`<option value="${p.id}" ${p.id===i.product?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>${page==='Solo Agents'?select('role','Specialist',roles,i.role):'<input type="hidden" name="role" value="Full farm">'}${field('title','Run name',i.title,'text',true)}${select('mode','Content type',['Product demonstration','Feature walkthrough','Evidence-based comparison','Roundup','Outfit styling','How-to','FAQ'],i.mode)}${select('presentation','Product presentation',['Not applicable','Holding the product','Wearing the product','Product only / no person'],i.presentation)}${field('objective','Goal',i.objective,'text',true)}${field('audience','Audience',i.audience||'Women 40+ learning to create and build businesses','text',true)}${select('platform','Destination',['Amazon storefront','TikTok','Instagram','YouTube','Facebook','Pinterest'],i.platform)}${select('duration','Video length',['15 seconds','30 seconds','60 seconds','90 seconds','Not a video'],i.duration)}${select('character','Creator / character',['No character','Use my uploaded creator references','Use existing character references'],i.character)}${field('tool','Preferred production tool',i.tool)}${area('references','Reference instructions / comparison product links',i.references)}${area('notes','Specific request, constraints and notes',i.notes)}<div class="wide muted">Reference images from this product are saved with the run. No character generation, publishing or Amazon connection happens when saving.</div><button class="primary">${editRun?'Save changes':'Save run'}</button></form>`}`}
if(page==='Queue'||page==='Results'){const runs=[...state.runs].sort((a,b)=>b.updated-a.updated).filter(r=>page==='Queue'||r.result||r.resultUrl);html=`<h1>${page==='Queue'?'Your run queue':'Your results'}</h1><p>${page==='Queue'?'Saved briefs ready for a handoff. Status labels are updated manually.':'Actual output you have pasted or linked to a run.'}</p>${runs.map(r=>`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(r.inputs.title)}</h3><span class="pill">${esc(r.status)}</span></div><p>${esc(r.product.name)} · ${esc(r.inputs.role)} · ${esc(r.inputs.platform)}</p><div class="row"><button class="primary" onclick="showRun('${r.id}')">View / copy task</button><button onclick="editRun='${r.id}';go('${r.inputs.role==='Full farm'?'Create Run':'Solo Agents'}')">Edit</button><button class="danger" onclick="removeRun('${r.id}')">Delete</button></div></div>`).join('')||'<div class="card empty"><h2>Nothing here yet</h2><p>Save a run, copy its task into chat, then attach the finished output.</p><button onclick="go(\'Create Run\')">Create a run</button></div>'}`}
if(page==='Help')html=`<h1>Help & connections</h1><div class="split"><div class="card"><h2>Your simple workflow</h2><ol><li>Add a product and its source facts.</li><li>Create a full run or select one agent.</li><li>Open the run and click Copy Task.</li><li>Paste it into Claude with the reference images.</li><li>Paste or link the finished output back into the run.</li></ol><p>Agent roles prepare instructions. This dashboard does not silently send messages or run background agents.</p></div><div class="card"><h2>Amazon storefront</h2>${amazonLinks()}<p>${esc(connectionMessage)}</p><button onclick="checkAmazon(this)">Test Amazon access</button><p class="muted">Report access was verified in your signed-in browser on October 26, 2026. This does not connect automatic data syncing.</p><form id="storeForm">${field('storefront','Your storefront URL',state.storefront,'url')}<p><button>Save link</button></p></form><p>Saving a link is a bookmark, not account access. Analytics, commissions and sales remain unavailable. This is a creator storefront workspace, not Seller Central.</p></div></div><div class="card"><h2>Back up your workspace</h2><p>Records and uploaded images stay in this browser. Export a backup before switching devices or clearing browser data. No API keys belong in this workspace.</p><button onclick="backup()">Export JSON backup</button><hr><label>Restore a backup<input type="file" id="importFile" accept="application/json,.json"></label><p>${select('restoreMode','Restore mode',['Merge (keep existing IDs)','Replace all data'])}</p><button onclick="restore()">Import backup</button></div>`;
$('#app').innerHTML=html;$('#amazonImport')?.addEventListener('submit',importAmazon);$('#productForm')?.addEventListener('submit',saveProduct);$('#runForm')?.addEventListener('submit',saveRun);$('#storeForm')?.addEventListener('submit',async e=>{e.preventDefault();const v=new FormData(e.target).get('storefront');if(!url(v))return toast('Use an http or https link.');if(await change(s=>s.storefront=v)){render();toast('Storefront link saved. Automatic sync is not connected.')}});}
async function readAssets(files){return Promise.all([...files].map(f=>new Promise((ok,no)=>{if(!['image/png','image/jpeg'].includes(f.type)||f.size>5*1024*1024)return no(Error('Use PNG/JPG images under 5 MB.'));const rd=new FileReader();rd.onload=()=>ok({name:f.name,data:rd.result});rd.onerror=()=>no(Error('Image could not be read.'));rd.readAsDataURL(f)})))}
async function saveProduct(e){e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));if(![d.url,d.affiliate,d.source].every(url))return toast('Use valid http or https links.');try{const old=state.products.find(p=>p.id===editProduct);const assets=[...(old?.assets||[]),...await readAssets(f.elements.assets.files)];const p={...d,id:old?.id||uid(),assets};if(await change(s=>{s.products=s.products.filter(x=>x.id!==p.id);s.products.push(p)})){editProduct='';render();toast('Product saved.')}}catch(e){toast(e.message)}}
async function saveRun(e){e.preventDefault();const inputs=Object.fromEntries(new FormData(e.target)),product=structuredClone(state.products.find(p=>p.id===inputs.product));if(!product)return toast('Choose a saved product.');if(inputs.character!=='No character'&&!product.assets.length)return toast('Add creator reference images to this product first.');if(!editRun&&state.runs.some(r=>JSON.stringify(r.inputs)===JSON.stringify(inputs)))return toast('This exact run already exists in your queue.');e.submitter.disabled=true;const old=state.runs.find(r=>r.id===editRun);const run={id:old?.id||uid(),inputs,product,status:old?.status||'saved',result:old?.result||'',resultUrl:old?.resultUrl||'',updated:Date.now()};if(await change(s=>{s.runs=s.runs.filter(r=>r.id!==run.id);s.runs.push(run)})){editRun='';go('Queue');toast('Brief saved. Copy its task to run it in chat.')}else e.submitter.disabled=false}
function task(r){let selected=r.inputs.role==='Full farm'?roles:[r.inputs.role];return `Act as my Amazon creator storefront content team. Complete the following request using real supplied evidence.\nStorefront: ${state.storefront || 'Not set'}\nAccount reports (requires authorized access): ${reportUrl}\nDo not claim access to these pages unless you actually retrieve them.\n\nRUN INPUTS\n${Object.entries(r.inputs).filter(([k])=>k!=='product').map(([k,v])=>k+': '+v).join('\n')}\n\nPRODUCT SNAPSHOT\n${Object.entries(r.product).filter(([k])=>!['id','assets'].includes(k)).map(([k,v])=>k+': '+v).join('\n')}\nReference image files: ${r.product.assets.map(a=>a.name).join(', ')||'None'}. Images must be attached separately; filenames do not give you image access.\n\nASSIGNMENTS\n${selected.map(role=>role+': '+tasks[roles.indexOf(role)]).join('\n\n')}\n\nCONSTRAINTS\nDo not invent personal use, testimonials, facts, prices, discounts, sales, commissions or affiliate URLs. Distinguish source-backed facts from unverified statements; research current details when supported. Preserve reference identity and body proportions. Use only the selected production tool; flag unavailable access. No publishing or purchases are authorized. Include transparent affiliate disclosure where relevant; verify current requirements before claiming compliance.\n\nDELIVERABLES\nProvide the requested specialist output in complete copyable sections. For a full run: evidence review, three content angles, shot list, timed script, visual prompts, caption/disclosure draft and production checklist. Identify missing inputs and unsupported claims. Provide actual media links only when generated.\n\nEXECUTION STATE\nDashboard manual status: ${r.status}. This is a saved handoff, not proof of execution.`}
function showRun(id){const r=state.runs.find(r=>r.id===id);lastTask=task(r);$('#detailBody').innerHTML=`<p>${esc(r.inputs.title)} · ${esc(r.product.name)}</p><button class="primary" onclick="copyTask()">Copy Task</button><p class="muted">Paste into Claude. Attach the reference images separately.</p><div class="row">${r.product.assets.map(a=>`<a href="#" onclick="fetch('${a.data}').then(r=>r.blob()).then(b=>__saveOut('${esc(a.name)}',b));return false"><img class="asset" src="${a.data}" alt="${esc(a.name)}"></a>`).join('')}</div><pre>${esc(lastTask)}</pre><form id="resultForm">${select('status','Manual status',['saved','queued','working','blocked','failed','done'],r.status)}<p class="muted">Working means you started the task elsewhere. Done requires an attached result.</p>${area('result','Paste completed output',r.result)}${field('resultUrl','Result or playable video URL',r.resultUrl,'url')}<p><button class="primary">Save result / status</button></p></form>`;$('#resultForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!url(d.resultUrl))return toast('Use an http or https result link.');if(d.status==='done'&&!d.result.trim()&&!d.resultUrl)return toast('Attach the completed output before marking done.');if(await change(s=>Object.assign(s.runs.find(x=>x.id===id),d,{updated:Date.now()}))){detail.close();render();toast('Run updated.')}};detail.showModal()}
async function copyTask(){try{await navigator.clipboard.writeText(lastTask);toast('Task copied. Paste it into Claude.')}catch{const t=document.createElement('textarea');t.value=lastTask;detail.append(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}if(ok){t.remove();toast('Task copied.')}else toast('Select the text box and press Ctrl+C / Copy.')}}
async function removeRun(id){if(await __ask('Delete this run and its attached results?')&&await change(s=>s.runs=s.runs.filter(r=>r.id!==id))){render();toast('Run deleted.')}}
async function removeProduct(id){if(await __ask('Delete this product? Existing runs keep their product snapshots.')&&await change(s=>s.products=s.products.filter(p=>p.id!==id))){render();toast('Product deleted.')}}
function backup(){__saveOut('glam-amazon-farm-backup.json',JSON.stringify(state))}
function valid(s){const str=x=>typeof x==='string';const prod=p=>p&&str(p.id)&&/^[\w-]+$/.test(p.id)&&['name','url','affiliate','category','facts','source','date','notes'].every(k=>str(p[k]))&&[p.url,p.affiliate,p.source].every(url)&&Array.isArray(p.assets)&&p.assets.every(a=>str(a.name)&&str(a.data)&&/^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(a.data));return s&&s.version===1&&str(s.storefront)&&url(s.storefront)&&Array.isArray(s.products)&&s.products.every(prod)&&Array.isArray(s.runs)&&s.runs.every(r=>r&&str(r.id)&&/^[\w-]+$/.test(r.id)&&prod(r.product)&&r.inputs&&['product','role','title','mode','presentation','objective','audience','platform','duration','character','tool','references','notes'].every(k=>str(r.inputs[k]))&&['Full farm',...roles].includes(r.inputs.role)&&['saved','queued','working','blocked','failed','done'].includes(r.status)&&str(r.result)&&str(r.resultUrl)&&url(r.resultUrl)&&Number.isFinite(r.updated)&&(r.status!=='done'||r.result.trim()||r.resultUrl))&&new Set(s.products.map(p=>p.id)).size===s.products.length&&new Set(s.runs.map(p=>p.id)).size===s.runs.length}
async function restore(){try{const f=$('#importFile').files[0];if(!f)return toast('Choose a JSON backup first.');if(f.size>100*1024*1024)throw Error('Backup is too large.');const incoming=JSON.parse(await f.text());if(!valid(incoming))throw Error('Invalid backup. No data changed.');const replace=$('[name=restoreMode]').value.startsWith('Replace');if(replace&&!await __ask('Replace all current products and runs with this backup?'))return;const n=replace?incoming:{...state,products:[...state.products,...incoming.products.filter(p=>!state.products.some(a=>a.id===p.id))],runs:[...state.runs,...incoming.runs.filter(p=>!state.runs.some(a=>a.id===p.id))]};if(await persist(n)){render();toast('Backup restored.')}}catch(e){toast(e.message)}}

async function amazonRequest(path,body){const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});let data;try{data=await res.json()}catch{throw Error('Amazon connection is unavailable. Please try again.')}if(!res.ok)throw Error(data.message||'Amazon request failed.');return data}
async function checkAmazon(button){button.disabled=true;button.textContent='Checking Amazon…';try{const d=await amazonRequest('/api/amazon/check');connectionMessage=d.message;$('#amazonStatus').textContent='Amazon product API: verified';toast(d.message)}catch(e){connectionMessage=e.message;$('#amazonStatus').textContent='Amazon product API: not available';toast(e.message)}finally{button.disabled=false;render()}}
async function importAmazon(e){e.preventDefault();const input=new FormData(e.target).get('asin').trim();let asin=input;if(/^https?:/i.test(input)){try{const u=new URL(input);if(!/(^|\.)amazon\.com$/.test(u.hostname))throw Error();asin=u.pathname.match(/\/(?:dp|gp\/product)\/([A-Z0-9]{10})(?:[/?]|$)/i)?.[1]||''}catch{return toast('Use an amazon.com product link or its 10-character ASIN.')}}asin=asin.toUpperCase();if(!/^[A-Z0-9]{10}$/.test(asin))return toast('Use a 10-character ASIN or a full Amazon /dp/ product link.');const b=e.submitter;b.disabled=true;b.textContent='Asking Amazon…';try{if(state.products.some(p=>p.url==='https://www.amazon.com/dp/'+asin))return toast('This product is already in your vault.');const d=await amazonRequest('/api/amazon/product',{asin});const p={id:uid(),name:d.title,category:'',url:'https://www.amazon.com/dp/'+asin,affiliate:d.url||'',facts:d.features.join('\n'),source:'https://www.amazon.com/dp/'+asin,date:new Date().toISOString().slice(0,10),notes:'Product details retrieved from Amazon Creators API. No personal-use claims.',assets:[]};if(await change(s=>s.products.push(p))){render();toast('Product added from Amazon.')}}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='Look up and add product'}}

const request=indexedDB.open('glam-amazon-farm',1);request.onupgradeneeded=()=>request.result.createObjectStore('data');request.onerror=()=>{$('#app').innerHTML='<div class="card"><h1>Browser storage is unavailable</h1><p>Open in a regular browser window with site storage enabled.</p></div>'};request.onsuccess=()=>{db=request.result;const q=db.transaction('data').objectStore('data').get('state');q.onsuccess=()=>{if(q.result){if(!valid(q.result)){toast('Stored data could not be loaded. Restore a valid backup.')}else state=q.result}render()};q.onerror=()=>toast('Unable to load saved work.')};
</script></html>
